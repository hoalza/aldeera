<script>
/* واجهة غرفة فوق WebSocket: نفس شكل room في Claude، لتعمل الصفحة خارج Claude */
window.__wsRoom=function(){
  const me=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  let ws=null,up=false,tries=0;const rooms={},connHs=[];
  const sendRaw=o=>{if(ws&&up)ws.send(JSON.stringify(o))};
  const setUp=v=>{if(up===v)return;up=v;connHs.slice().forEach(h=>{try{h(v)}catch(e){}})};
  function connect(){
    try{ws=new WebSocket(url)}catch(e){setTimeout(connect,2000);return}
    ws.onopen=()=>{tries=0;setUp(true);for(const n in rooms){sendRaw({t:'join',name:n,peer:me});sendRaw({t:'pres',name:n,full:true,p:rooms[n].pres})}};
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.t==='peers'&&rooms[m.name])rooms[m.name].onPeers(m.peers)};
    ws.onclose=()=>{setUp(false);setTimeout(connect,Math.min(5000,500+tries++*700))};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  connect();
  function make(name){
    const R={pres:{},pend:null,hs:[],list:[],left:false};
    const fire=()=>{const c={peers:R.list,joined:[],left:[],updated:[]};R.hs.slice().forEach(h=>{try{h(c)}catch(e){console.error(e)}})};
    R.onPeers=arr=>{const prev=new Map(R.list.map(p=>[p.peer,p]));
      R.list=arr.map(x=>{const mine=x.p===me;const pr=mine?R.pres:x.pr;const o=prev.get(x.p);
        if(o&&JSON.stringify(o.presence)===JSON.stringify(pr))return o;
        return Object.freeze({peer:x.p,isMe:mine,sameTab:mine,kind:'viewer',guest:false,by:null,presence:pr,updatedAt:Date.now()})});fire()};
    R.timer=setInterval(()=>{if(R.pend&&up){sendRaw({t:'pres',name,p:R.pend});R.pend=null}},33);
    R.api=Object.freeze({name,
      async presence(patch){if(R.left)throw{code:'invalid_argument',message:'left'};
        R.pend=R.pend||{};for(const k in patch){const v=patch[k];if(v===null)delete R.pres[k];else R.pres[k]=v;R.pend[k]=v}
        if(JSON.stringify(R.pres).length>8000)throw{code:'invalid_argument',message:'too big'}},
      peers:()=>R.list,
      onPeers(h){R.hs.push(h);setTimeout(()=>{if(R.hs.includes(h))h({peers:R.list,joined:R.list,left:[],updated:[]})},0);return()=>{R.hs=R.hs.filter(x=>x!==h)}},
      connected:()=>up,
      onConnection(h){connHs.push(h);return()=>{const i=connHs.indexOf(h);if(i>=0)connHs.splice(i,1)}},
      emit:async()=>{},on:()=>()=>{},
      async leave(){R.left=true;clearInterval(R.timer);sendRaw({t:'leave',name});delete rooms[name]}});
    return R}
  return{connected:()=>up,join:async name=>{
    if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(name))throw{code:'invalid_argument',message:'bad name'};
    if(rooms[name])return rooms[name].api;
    const R=rooms[name]=make(name);sendRaw({t:'join',name,peer:me});return R.api}};
};

/* ===== محرك الديرة الفوري (بلا واجهة): يعمل في المتصفح وفي الاختبارات ===== */
const W=600,H=800,SPEED=55,CALL_MULT=1.6,STORM_MULT=.55;
const SZ={S:{r:28,prod:.45,cap:25,gar:6,val:1},M:{r:36,prod:.7,cap:40,gar:10,val:2},L:{r:44,prod:1,cap:60,gar:15,val:3}};
const CAPI={r:46,prod:1.1,cap:70,val:0};
const MATCH=300,CAP_MULT=1.5,CAP_KEEP=8;
const TUNE={isl:1.35,cas:.75,boost:3};
const defMult=I=>I.cap?CAP_MULT:(I.owner!==null?TUNE.isl:1);
function rngMk(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hyp=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

class Sim{
  constructor(seed,opts={}){
    this.seed=seed;const rnd=this.rnd=rngMk(seed);const U=(a,b)=>a+(b-a)*rnd();
    this.t=0;this.over=false;this.winner=null;this.reason='';this.fleets=[];this.fx=[];this.log=[];this.nextF=1;
    this.call=[{used:false,until:0},{used:false,until:0}];
    this.stats=[{captured:0,lost:0,sent:0},{captured:0,lost:0,sent:0}];
    this.ISL=[];
    const mk=(o)=>{o.id=this.ISL.length;o.troops=o.troops||0;o.wounded=0;this.ISL.push(o);return o};
    mk({x:300,y:720,owner:0,cap:true,size:'C',r:CAPI.r,prod:CAPI.prod,capMax:CAPI.cap,val:0,troops:26,hidden:false,seedv:1});
    mk({x:300,y:80,owner:1,cap:true,size:'C',r:CAPI.r,prod:CAPI.prod,capMax:CAPI.cap,val:0,troops:26,hidden:false,seedv:2});
    const fogPair=1+Math.floor(rnd()*2);const pos=[];
    const sizes=[['M'],['S','L'],['S','M','L']];
    const placed=[{x:300,y:80},{x:300,y:720},{x:300,y:400}];
    const ok=(x,y,k)=>{const m={x:W-x,y:H-y};
      if(hyp({x,y},{x:300,y:80})<(k===0?150:170))return false;
      if(hyp({x,y},{x:300,y:80})>(k===0?235:9e9))return false;
      if(hyp({x,y},{x:300,y:400})<125)return false;
      if(hyp({x,y},m)<125)return false;
      return placed.every(o=>hyp({x,y},o)>=118&&hyp(m,o)>=118)};
    for(let k=0;k<3;k++){let x,y,i=0;
      for(;i<400;i++){x=U(70,530);y=k===0?U(130,330):U(110,365);if(ok(x,y,k))break}
      if(i>=400){x=k===0?180:(k===1?90:480);y=k===0?220:(k===1?290:180)}
      placed.push({x,y},{x:W-x,y:H-y});
      const pool=sizes[k];const sz=pool[Math.floor(rnd()*pool.length)];const S=SZ[sz];const hid=(k===fogPair);
      const gar=Math.round(S.gar+U(-1,1.4));
      mk({x:W-x,y:H-y,owner:null,cap:false,size:sz,r:S.r,prod:S.prod,capMax:S.cap,val:S.val,troops:gar,hidden:hid,seedv:10+k*2,pair:k});
      mk({x,y,owner:null,cap:false,size:sz,r:S.r,prod:S.prod,capMax:S.cap,val:S.val,troops:gar,hidden:hid,seedv:11+k*2,pair:k});
    }
    mk({x:300,y:400,owner:null,cap:false,size:'L',r:46,prod:1,capMax:60,val:3,troops:20,hidden:false,seedv:99,center:true});
    this.revealed=[new Set(),new Set()];
    this.storm={x:U(140,460),y:U(280,520),r:115,start:U(75,190),dur:20};
    this.stormWarned=false;this.stormOn=false;
    this.updateReveal();
  }
  get capMine(){return this.ISL[0]}
  owned(o){return this.ISL.filter(i=>i.owner===o)}
  isRevealed(o,i){return !i.hidden||i.owner!==null||this.revealed[o].has(i.id)}
  updateReveal(){for(const o of[0,1]){const mine=this.owned(o);for(const i of this.ISL){if(!i.hidden||this.revealed[o].has(i.id))continue;if(i.owner===o||mine.some(m=>hyp(m,i)<200))this.revealed[o].add(i.id)}}}
  speedOf(f){let s=SPEED;if(this.t<this.call[f.owner].until)s*=CALL_MULT;if(this.stormOn&&hyp(f,this.storm)<this.storm.r)s*=STORM_MULT;return s}
  ev(o){o.t=this.t;this.log.push(o);if(this.log.length>800)this.log.shift();this.fx.push(o)}
  sendFleet(owner,fromId,toId,n,silent){
    const a=this.ISL[fromId],b=this.ISL[toId];if(!a||!b||a.owner!==owner||a===b)return false;
    n=Math.floor(Math.min(n,a.troops-(a.cap?CAP_KEEP:0)));if(n<1)return false;
    a.troops-=n;const d=hyp(a,b);const ux=(b.x-a.x)/d,uy=(b.y-a.y)/d;
    this.fleets.push({id:this.nextF++,owner,n,to:b,from:a,x:a.x+ux*(a.r+4),y:a.y+uy*(a.r+4),trail:[],age:0});
    this.stats[owner].sent+=n;this.ev({type:'send',owner,from:fromId,to:toId,n});return true;
  }
  callBattle(o){const c=this.call[o];if(c.used||this.over)return false;c.used=true;c.until=this.t+12;this.ev({type:'call',owner:o});return true}
  nearestOwn(o,from,excludeId){let best=null,bd=1e9;for(const i of this.ISL){if(i.owner!==o||i.id===excludeId)continue;const d=hyp(i,from);if(d<bd){bd=d;best=i}}return best}
  update(dt){
    if(this.over)return;this.t+=dt;
    const s=this.storm;this.stormOn=this.t>=s.start&&this.t<s.start+s.dur;
    if(!this.stormWarned&&this.t>=s.start-5){this.stormWarned=true;this.ev({type:'stormwarn'})}
    // إنتاج وتعافي
    for(const i of this.ISL){if(i.owner===null)continue;
      if(i.wounded>0){const h=Math.min(i.wounded,.7+i.wounded*.12)*dt;i.wounded-=h;i.troops+=h;if(i.wounded<.05){i.troops+=i.wounded;i.wounded=0}}
      if(i.troops<i.capMax)i.troops=Math.min(i.capMax,i.troops+i.prod*dt*(i.wounded>0?.5:1))}
    // حركة السفن
    for(const f of this.fleets){
      const sp=this.speedOf(f)*dt;const d=hyp(f,f.to);f.age+=dt;
      f.trail.push({x:f.x,y:f.y,t:this.t});if(f.trail.length>14)f.trail.shift();
      f.heading=Math.atan2(f.to.y-f.y,f.to.x-f.x);
      if(d<=f.to.r+6+sp){f.arrive=true}else{f.x+=(f.to.x-f.x)/d*sp;f.y+=(f.to.y-f.y)/d*sp}
    }
    // اشتباك بحري
    const fl=this.fleets;
    for(let a=0;a<fl.length;a++){const A=fl[a];if(A.dead||A.arrive)continue;
      for(let b=a+1;b<fl.length;b++){const B=fl[b];if(B.dead||B.arrive||A.owner===B.owner)continue;
        if(hyp(A,B)<24){const big=A.n>=B.n?A:B,sm=big===A?B:A;
          const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
          if(Math.abs(A.n-B.n)<.01){A.dead=B.dead=true;this.stats[A.owner].lost+=A.n;this.stats[B.owner].lost+=B.n}
          else{this.stats[sm.owner].lost+=sm.n;this.stats[big.owner].lost+=sm.n*TUNE.cas;big.n=Math.max(1,big.n-sm.n*TUNE.cas);sm.dead=true}
          this.ev({type:'sea',x:mx,y:my,winner:Math.abs(A.n-B.n)<.01?null:big.owner,n:Math.round(Math.max(A.n,B.n))});break}}}
    for(const f of fl){if(f.arrive&&!f.dead){this.arrive(f);f.dead=true}}
    this.fleets=fl.filter(f=>!f.dead);
    this.updateReveal();
    if(!this.over&&this.t>=MATCH)this.finishTime();
  }
  arrive(f){
    const I=f.to;
    if(I.owner===f.owner){I.troops=Math.min(I.capMax+30,I.troops+f.n);this.ev({type:'reinforce',x:I.x,y:I.y,owner:f.owner,n:f.n});return}
    const a=f.n,mult=defMult(I);const oldOwner=I.owner;
    const dMen=I.troops+I.wounded;const D=(I.troops+I.wounded*.5)*mult;
    if(Math.abs(a-D)<.01){this.stats[f.owner].lost+=a;if(oldOwner!==null)this.stats[oldOwner].lost+=dMen;I.troops=0;I.wounded=0;this.ev({type:'battle',x:I.x,y:I.y,att:f.owner,def:oldOwner,winner:null,id:I.id,a,d:D});return}
    if(a>D){
      const c=D>0?a/D:99;const cas=TUNE.cas*D;
      let healthy=a-cas,wnd=cas/3;
      if(oldOwner!==null){this.stats[oldOwner].lost+=dMen*Math.min(1,.7);this.stats[f.owner].lost+=cas*2/3}
      let surv=0,flee=0,cap=0;
      if(oldOwner!==null&&c<2){surv=dMen*(2-c)/3;const other=this.nearestOwn(oldOwner,I,I.id);flee=other?surv/2:0;cap=surv-flee;wnd+=cap;
        if(flee>=1){this.fleets.push({id:this.nextF++,owner:oldOwner,n:Math.floor(flee),to:other,from:I,x:I.x,y:I.y,trail:[],age:0})}}
      I.owner=f.owner;I.troops=Math.max(0,healthy)+TUNE.boost;I.wounded=wnd;this.stats[f.owner].captured++;
      this.ev({type:'battle',x:I.x,y:I.y,att:f.owner,def:oldOwner,winner:f.owner,captured:true,crush:c>=2,id:I.id,a,d:D,cap:Math.floor(cap),flee:Math.floor(flee)});
      if(I.cap){this.over=true;this.winner=f.owner;this.reason='سقطت العاصمة';this.ev({type:'end',winner:f.owner})}
      this.updateReveal();
    }else{
      const c=a>0?D/a:99;const casDef=TUNE.cas*a/mult;
      if(oldOwner===null){I.troops=Math.max(0,I.troops-TUNE.cas*a)}
      else{const tk=Math.min(I.troops,casDef);I.troops-=tk;I.wounded+=casDef/3;this.stats[oldOwner].lost+=casDef*2/3}
      this.stats[f.owner].lost+=a*Math.min(1,.7+.3*(c>=2));
      let flee=0;if(c<2){flee=a*(2-c)/3;const other=this.nearestOwn(f.owner,I,-1);if(other&&flee>=1){this.fleets.push({id:this.nextF++,owner:f.owner,n:Math.floor(flee),to:other,from:I,x:I.x,y:I.y,trail:[],age:0})}else flee=0}
      this.ev({type:'battle',x:I.x,y:I.y,att:f.owner,def:oldOwner,winner:oldOwner===null?'N':oldOwner,crush:c>=2,id:I.id,a,d:D,flee:Math.floor(flee)});
    }
  }
  points(o){return this.owned(o).reduce((s,i)=>s+i.val,0)}
  men(o){return this.owned(o).reduce((s,i)=>s+i.troops+i.wounded,0)+this.fleets.filter(f=>f.owner===o).reduce((s,f)=>s+f.n,0)}
  finishTime(){this.over=true;const a=this.points(0),b=this.points(1);
    if(a!==b){this.winner=a>b?0:1;this.reason='النقاط '+Math.max(a,b)+' مقابل '+Math.min(a,b)}
    else{const x=this.men(0),y=this.men(1);if(Math.abs(x-y)>1){this.winner=x>y?0:1;this.reason='تعادل النقاط وفاز الأكثر رجالاً'}else{this.winner=-1;this.reason='تعادل'}}
    this.ev({type:'end',winner:this.winner});}
}

/* ======================== الذكاء الآلي ======================== */
const LEVELS={easy:{iv:3.6,need:.9,defend:.2,maxSend:1,pool:false,call:false,keep:0,capK:0,noise:.35},
  normal:{iv:2.0,need:1.3,defend:.8,maxSend:2,pool:false,call:true,keep:4,capK:.25,capMax:42,noise:.18},
  hard:{iv:.7,need:1.2,defend:1,maxSend:3,pool:false,call:true,keep:4,capK:.35,capMax:34,noise:.08,local:true}};
class Bot{
  constructor(sim,owner,level){this.sim=sim;this.o=owner;this.L=LEVELS[level];this.level=level;this.next=1+sim.rnd()*1.2;this.q=[];this.rr=rngMk(sim.seed*7+owner*13+1)}
  step(){
    const sim=this.sim,me=this.o,en=1-me,L=this.L;
    for(let i=this.q.length-1;i>=0;i--){const q=this.q[i];if(sim.t>=q.at){sim.sendFleet(me,q.from,q.to,q.n);this.q.splice(i,1)}}
    if(sim.t<this.next||sim.over)return;this.next=sim.t+L.iv*(.85+this.rr()*.3);
    const mine=sim.owned(me);if(!mine.length)return;
    const spd=SPEED*(sim.t<sim.call[me].until?CALL_MULT:1);
    const S=sim.owned(en).reduce((x,i)=>x+Math.max(0,i.troops-(i.cap?CAP_KEEP:3)),0);
    const capKeep=Math.max(CAP_KEEP,Math.min(L.capMax||42,L.capK*S));
    const kp=s=>(s.troops>=.85*s.capMax)?Math.min(L.keep,8):(s.cap?Math.max(L.keep,capKeep):L.keep);
    const threatened=new Set();
    // دفاع
    const inc={};for(const f of sim.fleets){if(f.owner!==me&&f.to.owner===me)(inc[f.to.id]=inc[f.to.id]||[]).push(f)}
    for(const id in inc){const I=sim.ISL[id];const fs=inc[id].sort((a,b)=>hyp(a,I)-hyp(b,I));
      let g=I.troops+I.wounded*.5,tprev=0,totalIn=0;
      for(const f of fs){const eta=Math.max(0,(hyp(f,I)-I.r)/SPEED);g+=I.prod*(eta-tprev);tprev=eta;totalIn+=f.n;
        const mult=defMult(I);

      for(const e of sim.ISL){if(e.owner!==en||hyp(e,I)>270)continue;T+=Math.max(0,e.troops-(e.cap?CAP_KEEP:2))}
      if(T>def*1.0){threatened.add(I.id);if(this.rr()>L.defend)continue;
        let need=(T*1.05-def)/mult+2;
        const srcs=mine.filter(s=>s.id!==I.id&&s.troops>10&&!threatened.has(s.id)).sort((a,b)=>b.troops-a.troops);
        for(const s of srcs){if(need<=0)break;const n=Math.min(Math.floor(s.troops-6),Math.ceil(need));if(n>=4){sim.sendFleet(me,s.id,I.id,n);need-=n}}}}}
    // هجوم:
    const inflight={};for(const f of sim.fleets)if(f.owner===me)inflight[f.to.id]=(inflight[f.to.id]||0)+f.n;
    for(const q of this.q)inflight[q.to]=(inflight[q.to]||0)+q.n;
    const targets=sim.ISL.filter(t=>t.owner!==me);
    let sent=0;
    const evalT=(s,t,avail)=>{
      const d=hyp(s,t),eta=(d-s.r)/spd;const vis=sim.isRevealed(me,t);

        srcs.forEach((s,i)=>{if(rem<=0)return;const n=Math.min(Math.floor(s.troops-kp(s)),rem);if(n<2)return;rem-=n;usedS.add(s.id);
          const delay=mx-etas[i];if(delay<.3)sim.sendFleet(me,s.id,t.id,n);else this.q.push({at:sim.t+delay,from:s.id,to:t.id,n});inflight[t.id]=(inflight[t.id]||0)+n});
        sent++;if(t.cap&&L.call&&!sim.call[me].used)sim.callBattle(me);continue}
      const n=Math.min(c.avail,Math.ceil(c.e.need));
      if(sim.sendFleet(me,c.s.id,c.t.id,n)){usedS.add(c.s.id);sent++;inflight[c.t.id]=(inflight[c.t.id]||0)+n;
        if(L.call&&!sim.call[me].used&&(c.t.cap||(n>=25&&sim.t>100)))sim.callBattle(me)}}
  }
}

  if(!ROOM){U.msg='الخدمة غير متاحة الآن';render();return}
  netLeave();U.msg='';U.lob={role,code};render();
  let room;try{room=await ROOM.join('d-'+code)}catch(e){U.lob=null;U.msg='تعذّر فتح الغرفة ('+(e&&e.code||'?')+'). جرّب مرة أخرى';render();return}
  if(!U.lob||U.lob.code!==code){try{room.leave()}catch(e){}return}
  NET={role,room,code,unsub:[],guestPeer:null,hostPeer:null,rid:null,cq:0,lastCq:0,lastEvq:0,lastN:0,evs:[],cmds:[],n:0,evq:0,acc:0,snap:null,gone:false,timer:0};
  NET.unsub.push(room.onPeers(netPeers,e=>{if(NET){NET.err=e.code+': '+e.message;netStatus()}}));
  NET.conn=room.connected();NET.unsub.push(room.onConnection(c=>{NET.conn=c;netStatus();if(G&&G.role)toast(c?'عاد الاتصال':'انقطع الاتصال…','#E2553F')}));
  room.presence({role}).catch(()=>{});
  if(role==='guest')NET.timer=setTimeout(()=>{if(NET&&!NET.hostPeer){const d='الاتصال '+(NET.conn?'✓':'✗')+'، أجهزة أخرى '+(NET.seen||0)+(NET.err?'، '+NET.err:'');netLeave();U.lob=null;U.msg='لا توجد غرفة بهذا الرمز. تأكد منه ومن أن المضيف ينتظر في شاشة الرمز. ('+d+')';render()}},12000);
}
function netStatus(){const el=document.getElementById('nst');if(!el||!NET)return;el.textContent='الاتصال: '+(NET.conn?'✓':'✗')+' · الأجهزة الأخرى في الغرفة: '+(NET.seen||0)+(NET.err?' · خطأ '+NET.err:'')}
function netPeers(ch){
  if(!NET)return;const others=ch.peers.filter(p=>!p.sameTab);NET.seen=others.length;netStatus();
  if(NET.role==='host'){
    if(!NET.guestPeer){const g=others.find(p=>p.presence&&p.presence.role==='guest');if(g){NET.guestPeer=g.peer;if(U.screen==='lobby')startGame({net:true})}return}
    const g=others.find(p=>p.peer===NET.guestPeer);
    if(!g){if(!NET.gone){NET.gone=true;toast('انقطع صديقك أو غادر','#E2553F')}return}
    if(NET.gone){NET.gone=false;toast('عاد صديقك','#2BAF7B')}
    netCmds(g.presence.cmd);
  }else{
    const h=NET.hostPeer?others.find(p=>p.peer===NET.hostPeer):others.find(p=>p.presence&&p.presence.role==='host');
    if(!h){if(NET.hostPeer&&!NET.gone){NET.gone=true;toast('انقطع المضيف أو غادر','#E2553F')}return}
    NET.gone=false;NET.hostPeer=h.peer;clearTimeout(NET.timer);const pr=h.presence;
    if(pr.rid&&pr.rid!==NET.rid&&pr.seed!=null){NET.rid=pr.rid;startGame({net:true,seed:pr.seed})}
    if(pr.snap&&pr.snap.rid===NET.rid&&pr.snap.n>NET.lastN){NET.lastN=pr.snap.n;NET.snap=pr.snap}
    if(Array.isArray(pr.ev)&&G&&G.role==='guest'){for(const x of pr.ev.slice().sort((a,b)=>a[0]-b[0])){if(x[0]<=NET.lastEvq)continue;NET.lastEvq=x[0];if(pr.rid===NET.rid)addEv(flipEv(x[1]))}}
  }
}
function netCmd(c){if(!NET)return;c.q=++NET.cq;NET.cmds=[...NET.cmds,c].slice(-8);NET.room.presence({cmd:NET.cmds}).catch(()=>{})}
function netCmds(list){
  if(!Array.isArray(list)||!G||G.role!=='host')return;
  for(const c of list.slice().sort((a,b)=>a.q-b.q)){
    if(!(c.q>NET.lastCq))continue;NET.lastCq=c.q;if(G.count>0||G.sim.over)continue;
    if(c.k==='s'){const f=Math.floor(+c.f),t=Math.floor(+c.t),n=Math.floor(+c.n);if(f>=0&&t>=0&&n>=1&&n<=999)G.sim.sendFleet(1,f,t,n)}
    else if(c.k==='c')G.sim.callBattle(1);
  }
}
const EVK=['type','x','y','owner','att','def','winner','captured','crush','id','cap','to','n'];
function netPushEv(e){if(!NET)return;if(!['battle','sea','reinforce','call','stormwarn','send'].includes(e.type))return;const o={};for(const k of EVK){const v=e[k];if(v===undefined||v===false)continue;o[k]=typeof v==='number'?Math.round(v):v}
  NET.evs=[...NET.evs,[++NET.evq,o]].slice(-10);NET.room.presence({ev:NET.evs}).catch(()=>{})}
function snapOf(sim){const r=x=>Math.round(x*10)/10;
  return{rid:NET.rid,n:++NET.n,t:r(sim.t),I:sim.ISL.map(i=>[i.owner===null?-1:i.owner,r(i.troops),r(i.wounded)]),
    F:sim.fleets.map(f=>[f.id,f.owner,r(f.n),Math.round(f.x),Math.round(f.y),f.to.id]),
    c:[sim.call[0].used?1:0,r(sim.call[0].until),sim.call[1].used?1:0,r(sim.call[1].until)],s:sim.stormOn?1:0,
    o:sim.over?1:0,w:sim.winner,r:sim.over?sim.reason:'',st:sim.stats.map(x=>[x.captured,Math.round(x.lost),Math.round(x.sent)])}}
function netHostTick(dt){if(!NET)return;NET.acc+=dt;if(NET.acc<.083)return;NET.acc=0;NET.room.presence({snap:snapOf(G.sim)}).catch(()=>{})}
function flipMirror(sim){
  for(const i of sim.ISL){i.x=W-i.x;i.y=H-i.y;if(i.owner!==null)i.owner=1-i.owner}
  sim.storm.x=W-sim.storm.x;sim.storm.y=H-sim.storm.y;sim.revealed=[new Set(),new Set()];sim.updateReveal()}
const FL=v=>v===0?1:v===1?0:v;
function flipEv(e){const o={...e};if(o.x!==undefined){o.x=W-o.x;o.y=H-o.y}for(const k of['owner','att','def','winner'])if(k in o)o[k]=FL(o[k]);return o}
function applySnap(sim,s){
  sim.t=s.t;sim.stormOn=!!s.s;
  s.I.forEach((r,k)=>{const i=sim.ISL[k];if(!i)return;i.owner=r[0]<0?null:1-r[0];i.troops=r[1];i.wounded=r[2]});
  sim.call[0]={used:!!s.c[2],until:s.c[3]};sim.call[1]={used:!!s.c[0],until:s.c[1]};
  const old=new Map(sim.fleets.map(f=>[f.id,f])),nf=[];
  for(const r of s.F){const id=r[0],X=W-r[3],Y=H-r[4];let f=old.get(id);
    if(f){f.n=r[2];if(Math.hypot(f.x-X,f.y-Y)>30){f.x=X;f.y=Y}else{f.x+=(X-f.x)*.5;f.y+=(Y-f.y)*.5}}
    else f={id,owner:1-r[1],n:r[2],to:sim.ISL[r[5]],from:sim.ISL[r[5]],x:X,y:Y,trail:[],age:0};
    f.to=sim.ISL[r[5]];if(f.to)nf.push(f)}
  sim.fleets=nf;
  sim.stats=[{captured:s.st[1][0],lost:s.st[1][1],sent:s.st[1][2]},{captured:s.st[0][0],lost:s.st[0][1],sent:s.st[0][2]}];
  if(s.o&&!sim.over){sim.over=true;sim.winner=FL(s.w);sim.reason=s.r||''}
  sim.updateReveal();
}
function guestStep(dt){
  const sim=G.sim;if(NET&&NET.snap&&NET.snap!==G.lastSnap&&NET.snap.rid===NET.rid){G.lastSnap=NET.snap;applySnap(sim,NET.snap)}
  if(sim.over)return;sim.t+=dt;G.tr+=dt;const push=G.tr>=1/30;if(push)G.tr=0;
  for(const f of sim.fleets){const sp=sim.speedOf(f)*dt,d=hyp(f,f.to);if(push){f.trail.push({x:f.x,y:f.y,t:sim.t});if(f.trail.length>14)f.trail.shift()}
    if(d>f.to.r+6+sp){f.x+=(f.to.x-f.x)/d*sp;f.y+=(f.to.y-f.y)/d*sp}}
}
window.addEventListener('resize',()=>{if(U.screen==='game'&&G){setupCanvas()}});
window.__d2={U,get G(){return G},startGame,render,Sim,Bot};
render();

</script>
